<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Journal — Adiyat Coto</title>
<meta name="description" content="Writing by Adiyat Coto.">
<link rel="icon" href="/favicon_io/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#101110;--ink:#f2f4ed;--muted:#989d94;--line:#2b2e2a;--acid:#cbff3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,sans-serif}.wrap{max-width:1120px;margin:auto;padding:0 32px}.meta{font:11px 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase}.nav{height:76px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.nav a{color:var(--ink);text-decoration:none}.brand b,.accent{color:var(--acid)}.links{display:flex;gap:22px}.links a{color:var(--muted);font:11px 'DM Mono',monospace;text-transform:uppercase}.links a:hover{color:var(--acid)}header{padding:115px 0 65px;border-bottom:1px solid var(--line)}h1{font-size:clamp(4rem,11vw,10rem);letter-spacing:-.09em;line-height:.8;margin:30px 0}header p{max-width:420px;color:var(--muted);font-size:17px}.bar{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:17px 0;border-bottom:1px solid var(--line);color:var(--muted)}button{font:11px 'DM Mono',monospace;text-transform:uppercase;border:0;background:none;color:var(--muted);cursor:pointer;padding:0}button.on,button:hover{color:var(--acid)}#filters{display:flex;gap:17px;overflow:auto}.entry{display:grid;grid-template-columns:125px 1fr auto;gap:25px;padding:31px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}.entry:hover h2{color:var(--acid)}.entry h2{font-size:clamp(1.3rem,2.4vw,2rem);letter-spacing:-.055em;margin:0 0 8px}.entry p{color:var(--muted);margin:0;font-size:14px;max-width:690px}.date{color:var(--acid);padding-top:8px}.arrow{color:var(--muted);font-size:21px}footer{padding:24px 0;color:var(--muted);font:10px 'DM Mono',monospace;text-transform:uppercase}@media(max-width:650px){.wrap{padding:0 20px}.links a:not(:nth-child(2)){display:none}header{padding:80px 0 45px}.entry{grid-template-columns:70px 1fr;gap:14px}.entry .arrow{display:none}.date{font-size:9px}}</style>
<style>header{padding:76px 0 42px}.entry{padding:22px 0;animation:rise .5s both}.entry:hover{background:#171916}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}footer{margin-top:18px}@media(max-width:650px){header{padding:58px 0 34px}}</style>
<style>body{isolation:isolate}body::before{content:'';position:fixed;z-index:0;inset:-30%;pointer-events:none;background:radial-gradient(circle at 25% 30%,rgba(203,255,61,.05),transparent 18%),radial-gradient(circle at 75% 75%,rgba(70,130,180,.07),transparent 22%);animation:drift 18s ease-in-out infinite alternate}body>*{position:relative;z-index:1}.nav{position:sticky;top:0;z-index:20;background:rgba(16,17,16,.84);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}@keyframes drift{to{transform:translate3d(5%,3%,0) scale(1.08)}}footer{padding:42px 0 120px}</style>
</head>
<body>
<nav class="nav wrap">
<a class="brand meta" href="/">ADIYAT <b>COTO</b>
</a>
<div class="links">
<a href="/">Profile</a>
<a class="accent" href="/journal/">Journal</a>
<a href="/podcast/">Podcast</a>
<a href="/#work">Projects</a>
</div>
</nav>
<main class="wrap">
<header>
<span class="meta accent">Archive / 01</span>
<h1>JOURNAL.</h1>
<p>Notes on markets, history, philosophy, and the questions that connect them.</p>
</header>
<div class="bar">
<div id="filters">
<button class="on" data-cat="all">All</button>
</div>
<span class="meta" id="count">Loading</span>
</div>
<div id="feed">
<p class="meta" style="padding:32px 0;color:var(--muted)">Fetching archive…</p>
</div>
</main>
<footer class="wrap">© 2026 Adiyat Coto · <a style="color:var(--acid)" href="https://medium.com/@coto.adiyat" target="_blank" rel="noopener">Medium ↗</a>
</footer>
<script>const API='https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fmedium.com%2Ffeed%2F%40coto.adiyat&api_key=gcujnglqeaho0omrp7ut6nl2f4wyzriazidpxxrw';let all=[],active='all';const clean=s=>{let d=document.createElement('div');d.innerHTML=s||'';return(d.textContent||'').replace(/\s+/g,' ').trim()};const render=()=>{let list=active==='all'?all:all.filter(x=>(x.categories||[]).includes(active)),f=document.getElementById('feed');document.getElementById('count').textContent=`${list.length} pieces`;f.innerHTML=list.length?list.map(x=>`<a class="entry" href="${x.link}" target="_blank" rel="noopener">
<span class="date meta">${x.pubDate?new Date(x.pubDate).toLocaleDateString('en-GB',{year:'numeric',month:'short'}):'—'}</span>
<div>
<h2>${clean(x.title)}</h2>
<p>${clean(x.description||x.content).slice(0,180)}</p>
</div>
<span class="arrow">↗</span>
</a>`).join(''):'<p class="meta" style="padding:32px 0">No entries.</p>'};fetch(API).then(r=>r.json()).then(d=>{all=d.items||[];let cats=[...new Set(all.flatMap(x=>x.categories||[]))].filter(Boolean).slice(0,7),bar=document.getElementById('filters');cats.forEach(c=>{let b=document.createElement('button');b.textContent=c;b.dataset.cat=c;bar.append(b)});bar.addEventListener('click',e=>{if(!e.target.dataset.cat)return;active=e.target.dataset.cat;bar.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===e.target));render()});render()}).catch(()=>{document.getElementById('feed').innerHTML=`<p class="meta" style="padding:32px 0">Archive unavailable. <a class="accent" href="https://medium.com/@coto.adiyat">Open Medium ↗</a>
</p>`});</script>
</body>
</html>

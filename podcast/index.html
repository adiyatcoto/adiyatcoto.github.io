</p>`);document.getElementById('toggle').onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>document.getElementById('toggle').textContent='Ⅱ';audio.onpause=()=>document.getElementById('toggle').textContent='▶';audio.ontimeupdate=()=>{document.getElementById('time').textContent=`${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;document.getElementById('fill').style.width=`${audio.duration?audio.currentTime/audio.duration*100:0}%`};document.getElementById('progress').onclick=e=>{let r=e.currentTarget.getBoundingClientRect();if(audio.duration)audio.currentTime=(e.clientX-r.left)/r.width*audio.duration};</script>
